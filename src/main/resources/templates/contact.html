
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal portfolio of Sujan K.C., a fullstack developer specializing in responsive web design, Java Spring-boot, and Vanilla JS.">
    <title >Contact Us</title>
    <link th:href="@{/images/favicon.ico?v=1}" rel="shortcut icon" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"/>
</head>
<style>
    .contact-card {
        transition: transform 0.3s ease-in-out;
        background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
        color: white;
        border: none;
        border-radius: 15px;
    }

    .contact-card:hover {
        transform: translateY(-10px);
        box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
    }

    .form-card {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        border-radius: 20px;
        border: none;
    }

    .contact-icon {
        background: rgba(255, 255, 255, 0.2);
        padding: 20px;
        border-radius: 50%;
        margin-bottom: 20px;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 20px;
    }

    .btn-primary {
        background: linear-gradient(135deg, #6B73FF 0%, #000DFF 100%);
        border: none;
        padding: 10px 30px;
        border-radius: 25px;
        transition: transform 0.3s ease;
    }

    .btn-primary:hover {
        transform: scale(1.05);
    }
    .btn-success {
        background: linear-gradient(135deg, #6B73FF 0%, #00ff2a 100%);
        border: none;
        padding: 10px 30px;
        border-radius: 25px;
        transition: transform 0.3s ease;
    }

    .btn-success:hover {
        transform: scale(1.05);
    }
</style>
<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">PortFolio App</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item me-2">
                        <a class="nav-link btn btn-success text-white me-2" th:href="@{/homepage}">Home</a>
                    </li>
                    <li class="nav-item me-2">
                        <a class="nav-link btn btn-success text-white me-2" th:href="@{/about}">About</a>
                    </li>
                    <li class="nav-item me-2">
                        <a class="nav-link active btn btn-success text-white me-2" th:href="@{/contact}">Contact</a>
                    </li>
                    <li class="nav-item me-2">
                        <a class="nav-link btn btn-primary text-white" th:href="@{/custom-login}">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contact Form Section -->
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h2 class="text-center mb-4">Contact Us</h2>
                <div class="card form-card shadow">
                    <div class="card-body">
                        <form th:action="@{/contact}" method="post">
                            <div class="mb-3">
                                <label for="name" class="form-label">Name</label>
                                <input type="text" class="form-control" id="name" name="name" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" name="email" required>
                            </div>
                            <div class="mb-3">
                                <label for="subject" class="form-label">Subject</label>
                                <input type="text" class="form-control" id="subject" name="subject" required>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Message</label>
                                <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
                            </div>
                            <div class="text-center">
                                <button type="submit" class="btn btn-primary">Send Message</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Contact Information -->
        <div class="row mt-5">
            <div class="col-md-4">
                <div class="card contact-card text-center mb-3">
                    <div class="card-body">
                        <div class="contact-icon">
                            <i class="fas fa-map-marker-alt fa-2x"></i>
                        </div>
                        <p class="card-title fw-bold mb-1">Address</p>
                        <p class="card-text">Gokarneshwor-3, Kathmandu</p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card contact-card text-center mb-3">
                    <div class="card-body">
                        <div class="contact-icon">
                            <i class="fas fa-phone fa-2x"></i>
                        </div>
                        <p class="card-title fw-bold mb-1">Mobile no:-</p>
                        <p class="card-text"> 9840348482 </p>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card contact-card text-center mb-3">
                    <div class="card-body">
                        <div class="contact-icon">
                            <i class="fas fa-envelope fa-2x"></i>
                        </div>
                        <p class="card-title fw-bold mb-1">Email</p>
                        <p class="card-text">suzankc20@gmail.com</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Font Awesome and Bootstrap JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
</body>
</html>
