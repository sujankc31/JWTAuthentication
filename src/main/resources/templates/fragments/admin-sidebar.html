<!-- src/main/resources/templates/fragments/admin-sidebar.html -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- Define the sidebar fragment with a parameter for active menu item -->
    <div th:fragment="adminSidebar(activeItem)" class="bg-light border-right col-sm-8" id="sidebar-wrapper">
        <div class="sidebar-heading d-flex justify-content-between align-items-center">
            <span id="admin">Admin Panel</span>
            <button class="btn btn-link" id="menu-toggle"><i class="bi bi-list"></i></button>
        </div>
        <div class="list-group list-group-flush">
            <a th:href="@{/admin/dashboard}" 
               class="list-group-item list-group-item-action bg-light"
               th:classappend="${activeItem == 'dashboard'} ? 'active' : ''"
               style="display: block;" 
               data-tooltip="Dashboard">
                <i class="bi bi-speedometer2 me-2" style="color:black"></i><span style="color:black">Dashboard</span>
            </a>
            <a th:href="@{/admin/usermanagement}" 
               class="list-group-item list-group-item-action bg-light"
               th:classappend="${activeItem == 'usermanagement'} ? 'active' : ''"
               data-tooltip="User Management">
                <i class="bi bi-people me-2"></i><span>User Management</span>
            </a>
            <a th:href="@{/admin/rolemanagement}" 
               class="list-group-item list-group-item-action bg-light"
               th:classappend="${activeItem == 'rolemanagement'} ? 'active' : ''"
               data-tooltip="Role Management">
                <i class="bi bi-shield-lock me-2"></i><span>Role Management</span>
            </a>

            <a th:href="@{/logout}" class="list-group-item list-group-item-action bg-light"
               data-tooltip="Logout">
                <i class="bi bi-box-arrow-right me-2"></i><span>Logout</span>
            </a>
            <div class="lg list-group-item list-group-item-action bg-light" ><i class="bi bi-person me-2 "></i>Logged in: <br>
                <th th:text="${username}"></th></div>
            <!-- Add more links as needed -->
        </div>
    </div>
</body>
</html>
