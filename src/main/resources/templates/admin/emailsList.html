<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.5.0/font/bootstrap-icons.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap-modal.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        #sidebar-wrapper.collapsed .list-group-item span {
            display: none;
        }

        #sidebar-wrapper.collapsed {
            width: 60px;
        }

        #sidebar-wrapper .list-group-item i {
            transition: transform 0.3s ease;
        }

        #sidebar-wrapper.collapsed .list-group-item i {
            transform: scale(1.2);
            /* Adjust icon size when collapsed */
        }

        #sidebar-wrapper.collapsed .list-group-item {
            position: relative;
        }

        #sidebar-wrapper.collapsed .list-group-item:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            background: #000;
            color: #fff;
            padding: 5px;
            border-radius: 3px;
            white-space: nowrap;
        }

        .pagination-container {
            display: flex;
            justify-content: center;
            margin: 20px 0;
        }
/* Pagination styles */
        .pagination {
            display: flex;
            list-style: none;
            border-radius: 0.25rem;
            margin: 0;
            padding: 0;
        }

        .page-item {
            margin: 0 2px;
        }

        .page-item.active .page-link {
            background-color: #007bff;
            border-color: #007bff;
            color: white;
        }

        .page-item.disabled .page-link {
            color: #6c757d;
            pointer-events: none;
        }

        .page-link {
            position: relative;
            display: block;
            padding: 0.5rem 0.75rem;
            line-height: 1.25;
            color: #007bff;
            background-color: #fff;
            border: 1px solid #dee2e6;
            border-radius: 4px;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
        }

        .page-link:hover {
            z-index: 2;
            color: #0056b3;
            text-decoration: none;
            background-color: #e9ecef;
            border-color: #dee2e6;
        }
    </style>
</head>

<body>

            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <span class="nav-link" th:text="${'Welcome, ' + username}">Welcome</span>

                    </li>
                    <li class="nav-item me-2">
                        <form th:action="@{/logout}" method="post">
                            <button class="btn btn-outline-light" type="submit">Logout</button>
                        </form>
                    </li>
                    <li class="nav-item">
                        <form th:action="@{/profile}">
                            <button class="btn btn-outline-light" type="submit">Profile</button>
                        </form>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <!-- Sidebar -->
    <div class="container-fluid">
        <div class="row">
            <div class="col-sm-3">
                <div th:replace="~{fragments/admin-sidebar :: adminSidebar('dashboard')}"></div>
                <!-- <div class="bg-light border-right col-sm-8" id="sidebar-wrapper">

                        </a>

                            data-tooltip="User Management">
                            <i class="bi bi-people me-2"></i><span>User Management</span>
                        </a>
                        <a th:href="@{admin/rolemanagement}" class="list-group-item list-group-item-action bg-light"

                    <div class="sidebar-footer">

            </div>
            <div class="col-sm-9">
                <div class="card shadow-sm mt-4">
                    <div class="card-header text-center">
                        <h4>Emails</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12 text-center">
                                <h4>Emails Table</h4>
                            </div>
                            <!-- <div class="col-md-6 text-end">
                                <button type="button" class="btn btn-success btn-sm" data-bs-toggle="modal"
                                    data-bs-target="#addRoleModal">
                                    <i class="bi bi-plus-circle me-2"></i>Add Role
                                </button>
                            </div> -->
                        </div>
                        <!-- Display Emails Table -->
                        <div class="table-responsive mt-3">
                            <table class="table table-hover table-striped table-bordered">
                                <thead style="background-color:rgba(107, 115, 255, 0.1);" class="table-light">
                                    <tr>
                                        <th scope="col">S.N.</th>
                                        <th scope="col">Id</th>
                                        <th scope="col">Name</th>
                                        <th scope="col">Subject</th>
                                        <th scope="col">Email Address</th>
                                        <th scope="col">Message</th>
                                        <th scope="col">Sent At</th>
                                        <!-- <th scope="col">Action</th> -->
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="email,i: ${emails}">
                                        <td th:text="${i.count}">S.N.</td>
                                        <td th:text="${email.id}">Id</td>
                                        <td th:text="${email.name}">Name</td>
                                        <td th:text="${email.subject}">Subject</td>
                                        <td th:text="${email.email}">Email Address</td>
                                        <td th:text="${email.message}">Message</td>
                                        <td th:text="${#temporals.format(email.createdAt, 'yyyy-MM-dd HH:mm:ss')}">Sent
                                            At</td>
                                        <!-- <td><a href="#"><i class="bi bi-pencil-square"></i></a> <a href="#"><i class="bi bi-trash"></i></a></td> -->
                                    </tr>
                                </tbody>
                                <div class="pagination-container" th:if="${totalPages > 1}">
                                    <nav aria-label="Page navigation">
                                        <ul class="pagination">
                                            <!-- Previous button -->
                                            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                                                <a class="page-link" th:href="@{/admin/emails(page=${currentPage - 1})}"
                                                    aria-label="Previous">
                                                    <span aria-hidden="true">&laquo;</span>
                                                </a>
                                            </li>

                                            <!-- Page numbers -->
                                            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                                                th:classappend="${i == currentPage} ? 'active'">
                                                <a class="page-link" th:href="@{/admin/emails(page=${i})}"
                                                    th:text="${i + 1}"></a>
                                            </li>

                                            <!-- Next button -->
                                            <li class="page-item"
                                                th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                                                <a class="page-link" th:href="@{/admin/emails(page=${currentPage + 1})}"
                                                    aria-label="Next">
                                                    <span aria-hidden="true">&raquo;</span>
                                                </a>
                                            </li>
                                        </ul>
                                    </nav>
                                </div>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('menu-toggle').addEventListener('click', function () {
            document.getElementById('sidebar-wrapper').classList.toggle('collapsed');
        });

</body>
