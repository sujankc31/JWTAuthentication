            left: 100%;
            top: 50%;
            transform: translateY(-50%);

            color: #fff;
            padding: 5px;
            border-radius: 3px;

        <div class="row">
            <div class="col-sm-3">
                <div th:replace="~{fragments/admin-sidebar :: adminSidebar('dashboard')}"></div>

                    <div class="sidebar-heading d-flex justify-content-between align-items-center ">
                        <span>Admin Panel</span>
                        <button class="btn btn-link" id="menu-toggle"><i class="bi bi-list"></i></button>

            </div>
            <div class="col-sm-9">
                <div class="card shadow-sm mt-4">
                    <div class="card-header text-center">
                        <h4>Role Management</h4>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-12 text-center">
                                <h4>Roles Table</h4>
                            </div>
                            <!-- <div class="col-md-6 text-end">
                                <button type="button" class="btn btn-success btn-sm" data-bs-toggle="modal"
                                    data-bs-target="#addRoleModal">
                                    <i class="bi bi-plus-circle me-2"></i>Add Role
                                </button>
                            </div> -->
                        </div>
                        <!-- Add Role Modal -->
                        <div class="modal fade" id="addRoleModal" tabindex="-1" aria-labelledby="addRoleModalLabel"
                            aria-hidden="true">
                            <div class="modal-dialog">
                                <div class="modal-content">
                                    <div class="modal-header bg-primary">
                                        <h5 class="modal-title text-light" id="addRoleModalLabel">Add New Role</h5>
                                        <button type="button" class="btn-close" data-bs-dismiss="modal"
                                            aria-label="Close"></button>
                                    </div>
                                    <div class="modal-body">
                                        <form id="roleForm" th:action="@{/admin/add-role}" method="post"
                                            class="p-4 bg-light rounded shadow-sm">
                                            <div class="mb-3">
                                                <label for="roleName" class="form-label fw-bold">Role Name</label>
                                                <input type="text" class="form-control" id="roleName" name="roleName"
                                                    pattern="ROLE_[A-Z]+" required />
                                                <div class="invalid-feedback" id="roleNameError">
                                                    Please enter a role name in the format ROLE_ADMIN.
                                                </div>
                                            </div>

                                            <div class="mb-3">
                                                <label for="roleDescription"
                                                    class="form-label fw-bold">Description</label>
                                                <textarea class="form-control" id="roleDescription"
                                                    name="roleDescription" rows="3" pattern="[A-Za-z0-9\s]+"
                                                    required></textarea>
                                                <div class="invalid-feedback" id="roleDescError">
                                                    Description must contain only alphanumeric characters and spaces.
                                                </div>
                                            </div>
                                            <div class="d-flex justify-content-end">
                                                <button type="submit" class="btn btn-success">Save Role</button>
                                            </div>
                                        </form>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="table-responsive mt-3">
                            <table class="table table-hover table-striped table-bordered">
                                <thead>
                                    <tr>
                                        <th>S.N.</th>
                                        <th>Id</th>
                                        <th>Rolename</th>
                                        <th>Description</th>
                                        <!-- <th>Action</th> -->
                                    </tr>
                                </thead>
                                <tbody id="roleTableBody">
                                </tbody>

                                <script th:inline="javascript">
                                    var roleTableBody = document.getElementById('roleTableBody');

                                    fetch("/user/all-roles")
                                        .then(response => response.json())
                                        .then(roles => {
                                            roles.forEach(role => {
                                                var row = document.createElement('tr');

                                                // Create the basic columns
                                                row.innerHTML = `
                    <td>${roles.indexOf(role) + 1}</td>
                    <td>${role.id}</td>
                    <td>${role.name}</td>
                    <td>${role.description}</td>
                    <!--
                    <td>
                        <div class="btn-group gap-2" role="group">
                           
                            <button type="button" class="btn btn-primary btn-sm"
                                    data-bs-toggle="modal"
                                    data-bs-target="#editRoleModal${role.id}">
                                Edit
                            </button>

                            
                            <a href="/admin/delete-role/${role.id}"
                               class="btn btn-danger btn-sm"
                               onclick="return confirm('Are you sure you want to delete this role?')">Delete</a>
                        </div>
                    </td>
                    -->
                `;

                                                roleTableBody.appendChild(row);

                                                // Create the modal separately
                                                var modalDiv = document.createElement('div');
                                                modalDiv.className = 'modal fade';
                                                modalDiv.id = `editRoleModal${role.id}`;
                                                modalDiv.tabIndex = -1;
                                                modalDiv.setAttribute('aria-labelledby', `editRoleModalLabel${role.id}`);
                                                modalDiv.setAttribute('aria-hidden', 'true');

                                                modalDiv.innerHTML = `
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="editRoleModalLabel${role.id}">
                                    Edit Role: ${role.name}
                                </h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <form action="/admin/edit-role" method="post">
                                    <input type="hidden" name="id" value="${role.id}" />
                                    <div class="form-group mb-3">
                                        <label for="roleName${role.id}">Role Name</label>
                                        <input type="text" class="form-control" id="roleName${role.id}" name="name"
                                            value="${role.name}" pattern="ROLE_[A-Z]+" required>
                                        <div class="invalid-feedback">
                                            Please enter a role name in the format ROLE_ADMIN.
                                        </div>
                                    </div>
                                    <div class="form-group mb-3">
                                        <label for="roleDescription${role.id}">Role Description</label>
                                        <input type="text" class="form-control" id="roleDescription${role.id}"
                                            name="description" value="${role.description}"
                                            pattern="[A-Za-z0-9\s]+" required>
                                        <div class="invalid-feedback" >
                                            Description must contain only alphanumeric characters and spaces.
                                        </div>
                                    </div>
                                    <div class="modal-footer">
                                        <button type="submit" class="btn btn-primary">Save</button>
                                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                `;

                                                // Append the modal to the document body
                                                document.body.appendChild(modalDiv);
                                            });
                                        });

                                </script>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function () {
            var successMessage = /*[[${successMessage}]]*/ null;

            if (successMessage) {
                var successToast = new bootstrap.Toast(document.getElementById('successToast'), {
                    delay: 2000 // Auto-hide after 1 second
                });
                successToast.show();
            }

            //script for role validation form
                const form = document.getElementById('roleForm');
                const roleNameInput = document.getElementById('roleName');
                const roleDescriptionInput = document.getElementById('roleDescription');
                const roleNameError = document.getElementById('roleNameError');
                const roleDescError = document.getElementById('roleDescError');

                // Custom validation for role name
                function validateRoleName() {
                    const roleNamePattern = /^ROLE_[A-Z]+$/;
                    const isValid = roleNamePattern.test(roleNameInput.value);

                    if (!isValid) {
                        roleNameInput.classList.add('is-invalid');
                        roleNameInput.classList.remove('is-valid');
                        roleNameError.textContent = 'Please enter a role name in the format ROLE_ADMIN.';
                        return false;
                    } else {
                        roleNameInput.classList.remove('is-invalid');
                        roleNameInput.classList.add('is-valid');
                        return true;
                    }
                }

                // Custom validation for description
                function validateDescription() {
                    const descPattern = /^[A-Za-z0-9\s]+$/;
                    const isValid = descPattern.test(roleDescriptionInput.value);

                    if (!isValid) {
                        roleDescriptionInput.classList.add('is-invalid');
                        roleDescriptionInput.classList.remove('is-valid');
                        return false;
                    } else {
                        roleDescriptionInput.classList.remove('is-invalid');
                        roleDescriptionInput.classList.add('is-valid');
                        return true;
                    }
                }

                // Add input event listeners for real-time validation
                roleNameInput.addEventListener('input', validateRoleName);
                roleDescriptionInput.addEventListener('input', validateDescription);

                // Form submission handler
                form.addEventListener('submit', function (event) {
                    // Prevent form from submitting by default
                    event.preventDefault();

                    // Validate all fields
                    const isRoleNameValid = validateRoleName();
                    const isDescriptionValid = validateDescription();

                    // If all validations pass, submit the form
                    if (isRoleNameValid && isDescriptionValid) {
                        // Show success message using Bootstrap toast or alert
                        showMessage('Role saved successfully!', 'success');

                        // Submit the form after a short delay to show the success message
                        setTimeout(() => {
                            // Clear form inputs
                roleNameInput.value = '';
                roleDescriptionInput.value = '';
                roleNameInput.classList.remove('is-valid');
                roleDescriptionInput.classList.remove('is-valid');
                
                form.submit();
                        }, 1000);
                    } else {
                        showMessage('Please fix the errors in the form.', 'danger');
                    }
                });

                // Function to show messages
                function showMessage(message, type) {
                    // Remove any existing alerts
                    const existingAlerts = document.querySelectorAll('.alert');
                    existingAlerts.forEach(alert => alert.remove());

                    // Create alert element
                    const alertDiv = document.createElement('div');
                    alertDiv.className = `alert alert-${type} alert-dismissible fade show mt-3`;
                    alertDiv.role = 'alert';
                    alertDiv.innerHTML = `
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        `;

                    // Insert the alert before the form
                    form.parentNode.insertBefore(alertDiv, form);

                    // Auto dismiss after 5 seconds
                    setTimeout(() => {
                        alertDiv.classList.remove('show');
                        setTimeout(() => alertDiv.remove(), 300);
                    }, 5000);
                }
            });
    </script>
    <script>
        document.getElementById('menu-toggle').addEventListener('click', function () {
            document.getElementById('sidebar-wrapper').classList.toggle('collapsed');
