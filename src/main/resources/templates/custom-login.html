<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
      <!-- Error Toast -->
      <div class="position-fixed top-0 start-50 translate-middle-x p-3" style="z-index: 11">
        <div id="errorToast" class="toast align-items-center text-white bg-danger border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" th:text="${errorMessage}">
                    Login Failed
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>
    <div class="container">
        <div class="row justify-content-center mt-5">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h3 class="text-center">Login</h3>
                    </div>
                    <div class="card-body">
                        <div th:if="${errorMessage}" class="alert alert-danger text-small" th:text="${errorMessage}">
                        </div>
                        <form th:action="@{/login1}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" name="username" required>
                            </div>
                            <!-- <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                            </div> -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" name="password" required>
                            </div>
                            <!-- <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}">
                            </div> -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary">Login</button>
                            </div>
                            <div class="text-center mt-3">
                                <a th:href="@{/register}">Don't have an account? Register here</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
      <!-- Script to show toast notification -->
      <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', function() {
            var errorMessage = /*[[${errorMessage}]]*/ null;
            
            if (errorMessage) {
                var errorToast = new bootstrap.Toast(document.getElementById('errorToast'), {
                    delay: 1000 // Auto-hide after 1 second
                });
                errorToast.show();
            }
        });
    </script>
</body>
</html>
