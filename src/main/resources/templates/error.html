
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Personal portfolio of Sujan K.C., a fullstack developer specializing in responsive web design, Java Spring-boot, and Vanilla JS.">
    <title>Error</title>
    <link th:href="@{/images/favicon.ico?v=1}" rel="shortcut icon" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5 text-center">
        <div class="alert alert-danger">
            <h1>Oops! Something went wrong</h1>
            <p th:if="${errorMessage}" th:text="${errorMessage}">An error occurred while loading the page.</p>
            <p th:unless="${errorMessage}">An unexpected error occurred. Please try again later.</p>
        </div>
        <a class="btn btn-primary mt-3" th:href="@{/homepage}">Return to Homepage</a>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
